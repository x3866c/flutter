# 在 fork 上编 Flutter 引擎 android_release_arm64（编当前分支的源码，补丁以提交形式放在 patched/* 分支上）。
# 记录腾出的磁盘、拉依赖耗时、全量 / 增量编译耗时和产物大小。
name: engine-android

on:
  workflow_dispatch:
  push:
    branches: ['patched/**']

jobs:
  android_release_arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 磁盘（清理前）
        run: df -h

      - name: 删掉用不到的预装工具链
        run: |
          start=$(date +%s)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az /usr/lib/jvm || true
          sudo docker image prune --all --force > /dev/null || true
          sudo apt-get clean
          echo "CLEAN_SEC=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          df -h

      - name: 选空间最大的盘
        run: |
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work && echo "WORK=/mnt/work" >> "$GITHUB_ENV"
          else
            mkdir -p "$HOME/work" && echo "WORK=$HOME/work" >> "$GITHUB_ENV"
          fi

      - name: 后台记录磁盘峰值
        run: |
          nohup bash -c 'while true; do df --output=used -k "$WORK" | tail -1 >> /tmp/disk_used.log; sleep 30; done' > /dev/null 2>&1 &

      - name: 安装 depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK/depot_tools"
          echo "$WORK/depot_tools" >> "$GITHUB_PATH"

      - name: 拉当前分支源码和引擎依赖
        run: |
          start=$(date +%s)
          cd "$WORK"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" flutter
          cd flutter
          cat > .gclient <<'GCLIENT'
          solutions = [
            {
              "custom_deps": {},
              "deps_file": "DEPS",
              "managed": False,
              "name": ".",
              "safesync_url": "",
              "url": "https://github.com/flutter/flutter.git",
              "custom_vars": {
                "download_fuchsia_deps": False,
                "download_esbuild": False,
              },
            },
          ]
          GCLIENT
          gclient sync --no-history --shallow -D
          echo "SYNC_SEC=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          du -sh "$WORK/flutter" || true
          df -h "$WORK"

      - name: 编译 android_release_arm64
        run: |
          start=$(date +%s)
          cd "$WORK/flutter/engine/src"
          ./flutter/tools/gn --runtime-mode release --android --android-cpu arm64 --no-rbe --no-goma
          ninja -C out/android_release_arm64 default clang_x64/gen_snapshot flutter/shell/platform/android:abi_jars
          echo "BUILD_SEC=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: 改一个文件后增量编译
        run: |
          start=$(date +%s)
          cd "$WORK/flutter/engine/src"
          touch flutter/lib/ui/painting/canvas.cc
          ninja -C out/android_release_arm64 default clang_x64/gen_snapshot flutter/shell/platform/android:abi_jars
          echo "INCR_SEC=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: 汇总
        if: always()
        run: |
          out="$WORK/flutter/engine/src/out/android_release_arm64"
          peak=$(sort -n /tmp/disk_used.log 2>/dev/null | tail -1)
          {
            echo "## android_release_arm64（$GITHUB_REF_NAME @ ${GITHUB_SHA:0:10}，$(nproc) 核）"
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| 清理预装工具链 | ${CLEAN_SEC:-?}s |"
            echo "| 拉源码 + gclient sync | ${SYNC_SEC:-?}s |"
            echo "| 首次全量编译 | ${BUILD_SEC:-?}s |"
            echo "| 改 canvas.cc 后增量编译 | ${INCR_SEC:-?}s |"
            echo "| 工作盘已用峰值 | $(( ${peak:-0} / 1024 / 1024 ))GB |"
            echo "| 源码 + 产物目录 | $(du -sh "$WORK/flutter" 2>/dev/null | cut -f1) |"
            echo "| out 目录 | $(du -sh "$out" 2>/dev/null | cut -f1) |"
            echo "| libflutter.so | $(ls -lh "$out"/libflutter.so 2>/dev/null | awk '{print $5}') |"
            echo "| arm64_v8a_release.jar | $(ls -lh "$out"/arm64_v8a_release.jar 2>/dev/null | awk '{print $5}') |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          df -h

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android_release_arm64
          path: |
            ${{ env.WORK }}/flutter/engine/src/out/android_release_arm64/libflutter.so
            ${{ env.WORK }}/flutter/engine/src/out/android_release_arm64/arm64_v8a_release.jar
            ${{ env.WORK }}/flutter/engine/src/out/android_release_arm64/clang_x64/gen_snapshot
          if-no-files-found: warn
          retention-days: 7
